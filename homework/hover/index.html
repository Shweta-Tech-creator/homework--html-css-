<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 10px;
        padding: 20px;
        text-align: center;
    }

    .container {
       left: 170px;
        height: 350px;
        width: 350px;
        border-radius: 10% 30%;
        display: flex;    
        justify-content: center; 
        align-items: center;
        position: relative;
        transition: 1s;
      }
      
      .container img { 
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(100%);
        transition: 0.5s ease;
      }
      
      .container:hover img {
        filter: grayscale(0%);
        transform: scale(1.1);
      }
      
      .grid {
        display: flex;
        justify-content: center;
        gap: 15px; 
        flex-wrap: wrap;
      }
      
    .figcation {
        position: absolute;
        color: white;
        font-size: 23px;
        text-align: center;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-weight: bold;
        text-shadow: 1px 1px 5px #000;
        pointer-events: none;
        opacity: 0; 
        transition: opacity 0.5s ease; 
      }
      
      .container:hover .figcation {
        opacity: 1; 
      }
      
      .section {
        padding: 10px;
        border-radius: 20px;
        margin-bottom: 50px;
    }
